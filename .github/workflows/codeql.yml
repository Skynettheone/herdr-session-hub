name: CodeQL
on:
  push:
    branches: [main]
    paths: ['mods/**/*.py', 'mods/**/*.js', 'scripts/**/*.py', 'tests/**/*.py', 'tests/**/*.mjs', '.github/workflows/codeql.yml']
  workflow_dispatch:
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9
        with:
          languages: javascript-typescript, python
          build-mode: none
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9
