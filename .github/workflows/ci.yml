name: Platform tests
on:
  push:
    branches: [main]
    paths: ['mods/**', 'tests/**', 'scripts/**', 'requirements*.lock', 'ruff.toml', '.github/workflows/ci.yml']
  pull_request:
    paths: ['mods/**', 'tests/**', 'scripts/**', 'requirements*.lock', 'ruff.toml', '.github/workflows/ci.yml']
  workflow_dispatch:
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: Test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            target: windows-x64
            lock: requirements-windows.lock
          - runner: ubuntu-24.04
            arch: x64
            target: linux-x64
            lock: requirements-linux-x64.lock
          - runner: macos-15
            arch: arm64
            target: macos-arm64
            lock: requirements-macos-arm64.lock
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: runner.os == 'Windows'
        with:
          node-version: '24'
      - run: >-
          python -m pip install --only-binary=:all: --require-hashes -r ${{ matrix.lock }}
      - if: runner.os == 'Windows'
        run: python -m pip install --only-binary=:all: --require-hashes -r requirements-dev-windows.lock
      - if: runner.os == 'Windows'
        run: python -m ruff check .
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsecret-tools gnome-keyring dbus-x11
          dbus-run-session -- bash -c 'printf "%s\n" "session-hub-ci-only" | gnome-keyring-daemon --unlock --components=secrets >/dev/null; HUB_TEST_NATIVE_VAULT=1 python -m unittest discover -s tests -v'
      - if: runner.os != 'Linux'
        env:
          HUB_TEST_NATIVE_VAULT: '1'
        run: python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        run: node --experimental-vm-modules --test tests/panel.test.mjs
      # Native SDK/GUI acceptance is manual on the installed Herdr release.
