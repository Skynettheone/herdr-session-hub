name: Windows tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
      - run: python -m unittest discover -s tests -v
      - run: node --experimental-vm-modules --test tests/panel.test.mjs
      # Native SDK/GUI acceptance is manual on the installed Herdr release.
